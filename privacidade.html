<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy / Política de Privacidade / Informativa sulla Privacy — Growth</title>
<meta name="theme-color" content="#090B12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#090B12; --ink-2:#12151F; --parchment:#F2F5FA;
    --line:rgba(180,200,255,0.14);
    --gold:#C9962F; --gold-soft:#E8C77E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(201,150,47,0.06), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(185,140,255,0.06), transparent 45%),
      var(--ink);
    color:var(--parchment);
    font-family:'Inter',sans-serif; min-height:100vh; line-height:1.65;
  }
  .wrap{max-width:720px;margin:0 auto;padding:40px 20px 80px;}
  .topRow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px;}
  .back{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-size:12.5px;
    color:rgba(242,245,250,0.6);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;
    transition:border-color .2s ease, color .2s ease;
  }
  .back:hover{border-color:var(--gold-soft);color:var(--gold-soft);}
  .langSwitch{display:flex;gap:6px;background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:999px;padding:4px;}
  .langBtn{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;
    background:none;border:none;color:rgba(242,245,250,0.55);padding:6px 12px;border-radius:999px;cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .langBtn.active{background:linear-gradient(145deg, var(--gold-soft), var(--gold));color:var(--ink);font-weight:700;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold-soft);}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:32px;margin:6px 0 4px;}
  .updated{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:rgba(242,245,250,0.4);margin-bottom:32px;}
  h2{
    font-family:'JetBrains Mono',monospace;text-transform:uppercase;font-size:13px;
    letter-spacing:0.08em;color:var(--gold-soft);margin:36px 0 12px;
  }
  p, li{font-size:15px;color:rgba(242,245,250,0.85);}
  ul{padding-left:20px;}
  li{margin-bottom:6px;}
  a{color:var(--gold-soft);}
  .card{
    background:rgba(18,21,31,0.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:20px 22px;margin-bottom:8px;
  }
  footer{margin-top:48px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(242,245,250,0.3);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topRow">
    <a class="back" href="index.html" id="backLink">← voltar ao app</a>
    <div class="langSwitch" id="langSwitch">
      <button type="button" class="langBtn" data-lang="it">IT</button>
      <button type="button" class="langBtn" data-lang="pt">PT</button>
      <button type="button" class="langBtn" data-lang="en">EN</button>
    </div>
  </div>

  <span class="eyebrow">Growth</span>
  <h1 id="title">Política de Privacidade</h1>
  <div class="updated" id="updated">Última atualização: 20 de agosto de 2026</div>

  <div class="card"><p id="intro"></p></div>

  <h2 id="h-collect"></h2>
  <ul id="l-collect"></ul>

  <h2 id="h-storage"></h2>
  <p id="p-storage"></p>

  <h2 id="h-share"></h2>
  <p id="p-share"></p>
  <ul id="l-share"></ul>

  <h2 id="h-local"></h2>
  <p id="p-local"></p>

  <h2 id="h-rights"></h2>
  <ul id="l-rights"></ul>

  <h2 id="h-minors"></h2>
  <p id="p-minors"></p>

  <h2 id="h-changes"></h2>
  <p id="p-changes"></p>

  <h2 id="h-contact"></h2>
  <p id="p-contact"></p>

  <footer id="footerText">Growth — planejador de metas semanal</footer>
</div>

    hLocal:'Cookie e archiviazione locale',
    pLocal:'L\'app usa l\'archiviazione locale del tuo browser (localStorage) solo per ricordare preferenze come la lingua scelta in questa pagina e se hai già chiuso l\'avviso di installazione — nulla di questo viene inviato fuori dal tuo dispositivo.',
    hRights:'I tuoi diritti',
    lRights:[
      '<strong>Accedere</strong> ai tuoi dati: tutto ciò che hai inserito appare nell\'app stessa.',

    hMinors:'Minori',
    pMinors:'L\'app non è rivolta a minori di 13 anni e non raccoglie intenzionalmente dati di bambini.',
    hChanges:'Modifiche a questa informativa',

    hContact:'Contatti',
    pContact:'Domande o richieste di cancellazione dati: <a href="mailto:ricardobatistainfo@gmail.com">ricardobatistainfo@gmail.com</a>',
    footer:'Growth — pianificatore di obiettivi settimanale'

};

function applyLang(lang){
  const t = I18N[lang];
  document.documentElement.lang = t.htmlLang;
  document.getElementById('backLink').textContent = t.back;
  document.getElementById('title').textContent = t.title;
  document.getElementById('updated').textContent = t.updated;
  document.getElementById('intro').innerHTML = t.intro;
  document.getElementById('h-collect').textContent = t.hCollect;
  document.getElementById('l-collect').innerHTML = t.lCollect.map(x=>`<li>${x}</li>`).join('');
  document.getElementById('h-storage').textContent = t.hStorage;
  document.getElementById('p-storage').innerHTML = t.pStorage;
  document.getElementById('h-share').textContent = t.hShare;
  document.getElementById('p-share').textContent = t.pShare;
  document.getElementById('l-share').innerHTML = t.lShare.map(x=>`<li>${x}</li>`).join('');
  document.getElementById('h-local').textContent = t.hLocal;
  document.getElementById('p-local').textContent = t.pLocal;
  document.getElementById('h-rights').textContent = t.hRights;
  document.getElementById('l-rights').innerHTML = t.lRights.map(x=>`<li>${x}</li>`).join('');
  document.getElementById('h-minors').textContent = t.hMinors;
  document.getElementById('p-minors').textContent = t.pMinors;
  document.getElementById('h-changes').textContent = t.hChanges;
  document.getElementById('p-changes').textContent = t.pChanges;
  document.getElementById('h-contact').textContent = t.hContact;
  document.getElementById('p-contact').innerHTML = t.pContact;
  document.getElementById('footerText').textContent = t.footer;
  document.querySelectorAll('.langBtn').forEach(b=> b.classList.toggle('active', b.dataset.lang===lang));
  try{ localStorage.setItem('growth_privacy_lang', lang); }catch(e){}
}

document.querySelectorAll('.langBtn').forEach(btn=>{
  btn.addEventListener('click', ()=> applyLang(btn.dataset.lang));
});

let initialLang = 'pt';
try{
  const saved = localStorage.getItem('growth_privacy_lang');
  if(saved && I18N[saved]) initialLang = saved;
  else{
    const nav = (navigator.language || 'pt').toLowerCase();
    if(nav.startsWith('en')) initialLang = 'en';
    else if(nav.startsWith('it')) initialLang = 'it';
  }
}catch(e){}
applyLang(initialLang);
</script>
</body>
</html>
